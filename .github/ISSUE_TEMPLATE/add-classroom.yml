name: 新增教室二维码
description: 提交教室信息和二进制二维码矩阵，由机器人生成 PR。
title: "[新增教室] "
body:
    - type: markdown
      attributes:
          value: |
              通过网站提交时，教室记录会自动填写在下面。也可以手动粘贴一条 JSON 记录。
              请核对教学楼、房间名称、房间号和还原图案。提交后机器人会校验并生成 PR，由维护者审核。
              记录会公开显示，请仅提交允许公开分享的教室二维码。
    - type: textarea
      id: record
      attributes:
          label: 教室记录
          description: 粘贴网站复制的 JSON，保留四个字段，不要附加原始照片。
          render: json
      validations:
          required: true
