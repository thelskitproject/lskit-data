name: 新增教室二维码
description: 提交教室信息和二进制二维码矩阵，由机器人生成 PR。
title: "[新增教室] "
body:
    - type: markdown
      attributes:
          value: |
              通过网站提交时，教室记录会自动填写在下面。也可以手动粘贴一条 JSON 记录。
              请核对教学楼、房间名称、房间号和还原图案。提交后机器人会校验并生成 PR，由维护者审核。

              #### 上传声明

              需要 GitHub 账号。创建 Issue 后，教室信息、二维码矩阵及你的 GitHub 账号会公开显示。网站不会随记录上传原始照片，请勿在 Issue 中另行附加含个人信息的照片。

              二维码矩阵可还原为可扫描图案。请勿提交含个人信息、私人凭证或不允许公开分享的二维码。提交即表示你确认有权公开分享该记录，且已核对教室信息与还原图案；请遵守学校相关规定，并对自己提交的内容负责。

              LSKit 为社区项目，并非学校官方服务。记录按现状提供，不保证其准确性、时效性或适用于学校系统；请自行核实，勿用于冒用身份、代签或绕过学校规定。在适用法律允许的范围内，项目不对因记录错误、失效或不当使用造成的损失承担责任；本说明不排除法律规定不得排除的责任。
    - type: textarea
      id: record
      attributes:
          label: 教室记录
          description: 网站提交时会自动填写。手动提交请粘贴 JSON，保留四个字段，不要附加原始照片。
          render: json
      validations:
          required: true
