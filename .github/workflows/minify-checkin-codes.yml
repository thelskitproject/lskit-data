name: Minify classroom records

on:
    push:
        branches: [main]
        paths:
            - checkin-codes.json
            - scripts/minify-checkin-codes.ts
            - .github/workflows/minify-checkin-codes.yml
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: minify-checkin-codes
    cancel-in-progress: false

jobs:
    minify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - name: Generate compact records
              run: node scripts/minify-checkin-codes.ts
            - name: Commit compact records
              run: |
                  git add checkin-codes.min.json
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update compact classroom records"
                  git push origin HEAD:main
