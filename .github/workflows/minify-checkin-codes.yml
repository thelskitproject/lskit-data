name: Minify classroom records

on:
    push:
        branches: [main]
        paths:
            - checkin-codes.json
            - scripts/minify-checkin-codes.ts
            - .github/workflows/minify-checkin-codes.yml
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: minify-checkin-codes
    cancel-in-progress: false

jobs:
    minify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - name: Generate compact records
              run: node scripts/minify-checkin-codes.ts
            - name: Create compact records PR
              id: pr
              uses: peter-evans/create-pull-request@v8
              with:
                  branch: bot/minify-checkin-codes
                  add-paths: checkin-codes.min.json
                  commit-message: Update compact classroom records
                  title: Update compact classroom records
                  body: |
                      Updates the compact JSON generated from the reviewed classroom records.
                      This PR can be merged automatically only when it changes this generated file alone and exactly matches the source records on main.
            - name: Validate and merge generated file
              if: steps.pr.outputs.pull-request-number != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
              run: node scripts/merge-compact-records.ts
